name: withny points snapshot

on:
  schedule:
    # 10 分ごと。分境界(0,10,20…)は混雑で間引かれやすいので 3 分ずらす。
    # GitHub の負荷で数分〜数十分ずれる／スキップされることがある（仕様）。
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch: {} # Actions タブから手動実行できるように
  repository_dispatch: # 外部 cron から叩く保険（GitHub のスケジューラが不発のとき用）
    types: [run-snapshot]

permissions:
  contents: read

concurrency:
  group: withny-points
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run snapshot
        run: node points-snapshot.js
        env:
          WITHNY_SESSION_TOKEN: ${{ secrets.WITHNY_SESSION_TOKEN }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_NAME: data2

      # withny がセッション Cookie をローテーションしていたら、新トークンで
      # Secret WITHNY_SESSION_TOKEN を上書きする（トークンの延命）。
      # WITHNY_GH_PAT = Secrets: Read and write 権限の Fine-grained PAT。
      - name: Persist rotated session token
        if: always()
        env:
          GH_TOKEN: ${{ secrets.WITHNY_GH_PAT }}
        run: |
          if [ ! -s .rotated-session-token ]; then
            echo "今回はローテーションなし"
            exit 0
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::WITHNY_GH_PAT 未設定のため Secret を更新できません（トークンはいずれ失効します）"
            exit 0
          fi
          gh secret set WITHNY_SESSION_TOKEN --repo "$GITHUB_REPOSITORY" --body "$(cat .rotated-session-token)"
          echo "::notice::WITHNY_SESSION_TOKEN を更新しました"
